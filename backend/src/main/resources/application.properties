spring.application.name=travel-planner-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/travel_planner
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-migration-naming=true
spring.devtools.restart.additional-exclude=db/migration/**
spring.data.web.pageable.max-page-size=50
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.4
spring.ai.google.genai.chat.max-output-tokens=8192
# Bound AI calls: one retry with a short wait (defaults: 10 attempts, waits growing x5) and a per-request timeout.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10s
app.ai.request-timeout=90s
# Swagger UI: list endpoints in a stable order; error responses are documented per endpoint, not globally.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.override-with-generic-response=false